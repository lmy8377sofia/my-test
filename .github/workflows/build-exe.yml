name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 运行自检
        run: python pdf_stamp.py --selftest

      - name: PyInstaller 打包 exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PDF电子盖章工具" --icon assets/app.ico pdf_stamp.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PDF电子盖章工具-windows-exe
          path: dist/*.exe
